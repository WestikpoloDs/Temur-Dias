<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 4</title>
  <link rel="stylesheet" href="task4.css">
</head>
<body>

  <h1 id="grades-heading">Student Grades</h1>

  <table class="grades-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Subject</th>
        <th>Grade</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Damir Akhmetov</td>
        <td>Web Development</td>
        <td>95</td>
      </tr>
      <tr class="highlight-row">
        <td>Aigerim Satova</td>
        <td>Web Development</td>
        <td>100</td>
      </tr>
      <tr>
        <td>Yerlan Bekenov</td>
        <td>Web Development</td>
        <td>88</td>
      </tr>
      <tr>
        <td rowspan="2">Madina Ospanova</td>
        <td>Web Development</td>
        <td>91</td>
      </tr>
      <tr>
        <td>Databases</td>
        <td>84</td>
      </tr>
    </tbody>
  </table>

  <h1>Feedback Form</h1>

  <form class="feedback-form" id="feedback-form">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" placeholder="Enter your name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="name@example.com" required>

    <label for="role">Role</label>
    <select id="role" name="role">
      <option value="student">Student</option>
      <option value="teacher">Teacher</option>
      <option value="other">Other</option>
    </select>

    <fieldset class="radio-group">
      <legend>Did you enjoy the course?</legend>
      <label class="radio-label"><input type="radio" name="liked" value="yes"> Yes</label>
      <label class="radio-label"><input type="radio" name="liked" value="no"> No</label>
    </fieldset>

    <label for="comments">Comments</label>
    <textarea id="comments" name="comments" rows="4" placeholder="Your thoughts and comments"></textarea>

    <button type="submit" class="submit-btn">Submit</button>
  </form>

</body>
</html>
